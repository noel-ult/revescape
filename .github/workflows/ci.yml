name: Game and production image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: docker compose -f compose.yaml config --quiet
      - name: Build the Dokploy image
        run: docker build -t revescape-ci .
      - name: Verify the production container and WebSockets
        run: |
          docker run -d --rm --name revescape-ci -p 3003:3001 -e PUBLIC_ORIGIN=http://localhost:3003 revescape-ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3003/api/health; then break; fi
            sleep 1
          done
          npm run smoke -- http://localhost:3003
      - name: Container logs
        if: always()
        run: docker logs revescape-ci 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
